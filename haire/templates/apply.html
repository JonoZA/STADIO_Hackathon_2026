<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../static/styles/applyStyles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  
    

  <body>
    <header class="site-header">
        <h1 class="title">Linkdeed</h1>
    </header>
    <div class="mainListings">
      <div class="card" data-job="junior-dev">
        <div class="card-header">
          <h2>Junior Software Developer</h2>
          <p class="summary">Click to apply — basic details only.</p>
        </div>

        <form class="form" id="form-junior" enctype="multipart/form-data">
          <label>Full name:</label>
          <input type="text" name="fullName" required />

          <label>Cellphone number:</label>
          <input type="tel" name="cellphone" required />

          <label>Email:</label>
          <input type="email" name="email" required />

          <label>Address:</label>
          <input type="text" name="address" />

          <label>Gender:</label>
          <select name="gender" id="gender">
            <option value="Other">Other</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>

          <label>Marriage Status:</label>
          <select name="marStatus" id="marStatus">
            <option value="Married">Married</option>
            <option value="notMarried">Not Married</option>
          </select>

          <label>Do you have reliable transport?</label>
          <select name="transport" id="transport">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>

          <label>What is your nationality</label>
          <select name="nationality" id="nationality">
            <option value="South Africa">South Africa</option>
            <option value="Namibia">Namibia</option>
            <option value="Botswana">Botswana</option>
            <option value="Other">Other</option>
          </select>

          <div class="upload-section">
            <label for="cv-junior">Upload a CV:</label>
            <input type="file" id="cv-junior" name="cv" accept=".pdf" />

            <button type="submit" class="submit-btn">Submit</button>
          </div>
        </form>
      </div>

      <div class="card" data-job="teacher">
        <div class="card-header">
          <h2>Teacher</h2>
          <p class="summary">Click to apply — basic details only.</p>
        </div>

        <form class="form" id="form-teacher" enctype="multipart/form-data">
          <label>Full name:</label>
          <input type="text" name="fullName" required />

          <label>Cellphone number:</label>
          <input type="tel" name="cellphone" required />

          <label>Email:</label>
          <input type="email" name="email" required />

          <label>Address:</label>
          <input type="text" name="address" />

          <label>Gender:</label>
          <select name="gender" id="gender-teacher">
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="other">Other</option>
          </select>

          <label>Marriage Status:</label>
          <select name="marStatus" id="marStatus-teacher">
            <option value="Married">Married</option>
            <option value="notMarried">Not Married</option>
          </select>

          <label>Do you have reliable transport?</label>
          <select name="transport" id="transport-teacher">
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>

          <label>What is your nationality</label>
          <select name="nationality" id="nationality-teacher">
            <option value="South Africa">South Africa</option>
            <option value="Namibia">Namibia</option>
            <option value="Botswana">Botswana</option>
            <option value="Other">Other</option>
          </select>

          <div class="upload-section">
            <label for="cv-teacher">Upload a CV:</label>
            <input type="file" id="cv-teacher" name="cv" accept=".pdf" />

            <button type="submit" class="submit-btn">Submit</button>
          </div>
        </form>
      </div>
    </div>
    <div id="stage-end" class="stage-end hidden">Application submitted. Thank you!</div>
    <script src="../static/scripts/apply.js"></script>
  </body>
</html>
