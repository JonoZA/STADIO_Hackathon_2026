<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hAIre</title>
    <meta name="theme-color" content="#0d6efd">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../static/styles/indexStyles.css" />
</head>
<body>

    <div class="hero-haze"></div>

    <div class="page-wrapper">

        <!-- ABOVE SECTION -->
        <section class="hero-section">

            <div class="hero-content">
                <h1 class="hero-title">hAIre</h1>
                <p class="hero-subtitle">Explore this demo of the hAire recruitment tool</p>
                <p class="hero-subtitle-small">Select whether you are an applicant applying or a recruiter filtering applicants</p>

                <div id="message"></div>

                <form class="brief-form" action="/" method="post">
                    <button class="btn brief-btn shadow" type="submit">Read our brief</button>
                </form>
            </div>

            <div class="action-buttons">
                <a href="{{ url_for('apply') }}">
                    <button class="btn action-btn shadow" type="submit">APPLY NOW</button>
                </a>

                <a href="{{ url_for('recruit') }}">
                    <button class="btn action-btn shadow" type="submit">RECRUIT</button>
                </a>
            </div>
        </section>

    </div>

    <footer>
        <small>
            Created by: Elye Fredricks, Geremie Ishimwe, Leyton Manthopoulos, Jonathan Rajdl and Carl Vlok
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
