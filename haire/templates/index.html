<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hAIre — AI Recruitment Platform</title>
    <meta name="theme-color" content="#04130b">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles/indexStyles.css" />
</head>
<body>

    <div class="hero-haze"></div>

    <div class="page-wrapper">

        <!-- Top Right Floating Brief Button -->
        <div class="brief-form">
            <a href="{{ url_for('view_bp.brief') }}" aria-label="Read our project brief">
                <button class="brief-btn" type="button" aria-label="Read our brief">
                    <svg class="brief-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 3.5h9l3 3V20.5H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                        <path d="M15 3.5v3h3M9 11h6M9 14.5h6M9 8h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
                <span class="brief-tooltip">Read Project Brief</span>
            </a>
        </div>

        <main class="hero-section">
            <div class="title-row">
                <h1 class="hero-title">hAIre</h1>
            </div>

            <p class="hero-tagline">Turning your recruitment process from text to Gold</p>
            <p class="hero-subtitle">Explore the interactive demo of the hAIre platform</p>
            <p class="hero-subtitle-small">Choose your pathway below to experience the workflow</p>

            <div class="action-buttons">
                <a href="{{ url_for('apply') }}">
                    <button class="action-btn" type="button">APPLY NOW</button>
                </a>
                <a href="{{ url_for('recruit') }}">
                    <button class="action-btn" type="button">RECRUITER DASHBOARD</button>
                </a>
            </div>
        </main>

        <footer>
            <small>
                Created by Elye Fredricks, Geremie Ishimwe, Leyton Manthopoulos, Jonathan Rajdl & Carl Vlok
            </small>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
