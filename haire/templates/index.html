<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hAIre</title>
    <meta name="theme-color" content="#0d6efd">

    <!-- Bootstrap CSS (was missing, so navbar/card/btn classes had no effect) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            /* linear-gradient() with no stops is invalid, so give it real colors */
            background: linear-gradient(180deg, #0d6efd, #002a63);
            color: blanchedalmond;
            min-height: 100vh;
        }

        /* Make the "HOME" nav brand read as a real page header */
        .page-header {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            padding: 0.75rem 0;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.08);
            color: blanchedalmond;
        }

        .intro-text {
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 1rem 0;
            color: blanchedalmond;
        }
    </style>
</head>
<body>

    <!-- HOME as the page header, centered -->
    <header class="page-header">hAIre</header>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">

                <!-- "Read our brief" left-aligned -->
                <form action="/" method="post" class="mb-4">
                    <button class="btn btn-success shadow" type="submit">Read our brief</button>
                </form>

                <div id="message"></div>

                <!-- Intro text centered -->
                <div class="mb-4 intro-text">
                    <h1>Explore this demo of the hAire recruitment tool</h1>
                    <h2>Select whether you are an applicant applying or a recruiter filtering applicants</h2>
                </div>

                <!-- Apply / Recruit buttons centered and side by side -->
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <form action="/submit" method="post">
                        <button class="btn btn-success shadow" type="submit">APPLY NOW</button>
                    </form>

                    <form action="/submit" method="post">
                        <button class="btn btn-success shadow" type="submit">RECRUIT</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Credits moved to a real footer -->
    <footer>
        <small class="text-light">
            Created by: Elye Fredricks, Geremie Ishimwe, Leyton Manthopoulos, Jonathan Rajdl and Carl Vlok
        </small>
    </footer>

    <!-- Bootstrap JS bundle (needed if you use any interactive components like dropdowns/modals later) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>git
