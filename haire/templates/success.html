<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Successful - hAIre</title>
    
    <style>
        
        body {
            font-family: 'Abadi', Arial, sans-serif;
            
           
            background: linear-gradient(to right, #f0f0f5 0%, #6e589e 50%, #15003b 100%);
            margin: 0;
            
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        
        .content-box {
            background-color: #ebeaf3; 
            padding: 50px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 650px;
            width: 90%;
        }

        
        .main-message {
            font-size: 2rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 35px;
        }

       
        .sub-message {
            font-size: 1.1rem;
            color: #333333;
            margin-bottom: 20px;
        }

        
        .blue-btn {
            background-color: #0d6efd; 
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 40px;
            transition: background-color 0.2s;
        }

        .blue-btn:hover {
            background-color: #0b5ed7; 
        }

        
        .disclaimer-text {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="content-box">
        
        <div class="main-message">
            You have successfully submitted your resume to hAIre resume !
        </div>
        
        <div class="sub-message">
            Click here to see how hAIre works
        </div>
        
        
        <a href="#" class="blue-btn">
            How hAIre Works
        </a>
        
        <div class="disclaimer-text">
            "this is purely for demo purposes and this wont be used in production
        </div>

    </div>

</body>
</html>
